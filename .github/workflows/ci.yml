name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from the packageManager field, so CI and local
      # development cannot drift apart.
      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # dist/ is committed so the package can be installed straight from git
      # (pnpm 10 does not run a dependency's prepare script). That only holds
      # while the committed output matches src, so a stale build fails here
      # instead of shipping silently to consumers.
      - name: Check committed dist is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run 'pnpm build' and commit the result."
            git diff --stat -- dist
            exit 1
          fi

      - name: Test
        run: pnpm test
